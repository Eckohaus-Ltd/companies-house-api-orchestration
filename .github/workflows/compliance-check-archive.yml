name: Compliance Check (Companies House - Archive Sandbox)

on:
  workflow_dispatch:  # Manual trigger only — safe testing mode

permissions:
  contents: write  # allows saving test JSON and ledger updates

jobs:
  check-archive-sandbox:
    name: Sandbox Archival Verification (Eckohaus Ltd 2013–2021)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load archival metadata
        id: metadata
        run: |
          echo "Loading archival metadata from config/metadata.yml"
          COMPANY_NAME=$(grep 'name:' config/metadata.yml | awk '{print $2" "$3}')
          COMPANY_NUMBER=$(grep 'company_number:' config/metadata.yml | awk '{print $2}')
          echo "company_name=$COMPANY_NAME" >> $GITHUB_OUTPUT
          echo "company_number=$COMPANY_NUMBER" >> $GITHUB_OUTPUT
          echo "✅ Loaded archival entity: $COMPANY_NAME ($COMPANY_NUMBER)"

      - name: Query Companies House Sandbox API
        id: ch_query
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY_ARCHIVE_SANDBOX }}
          COMPANY_NUMBER: ${{ steps.metadata.outputs.company_number }}
        run: |
          echo "🔍 Querying Companies House SANDBOX API for company $COMPANY_NUMBER"
          AUTH_HEADER=$(echo -n "$CH_API_KEY:" | base64)
          curl -s -H "Authorization: Basic $AUTH_HEADER" \
               "https://api.company-information.service.gov.uk/company/$COMPANY_NUMBER" \
               -o response_sandbox.json

          if [ ! -s response_sandbox.json ]; then
            echo "❌ No response received or file empty."
            exit 1
          fi
          echo "✅ Sandbox response saved to response_sandbox.json"

      - name: Display sandbox response summary
        run: |
          echo "📄 Companies House SANDBOX API response:"
          sudo apt-get update -qq && sudo apt-get install -y jq -qq
          jq . response_sandbox.json || cat response_sandbox.json

      - name: Store sandbox response
        if: always()
        run: |
          mkdir -p data/sandbox_responses
          TIMESTAMP=$(date +'%Y%m%d_%H%M')
          cp response_sandbox.json "data/sandbox_responses/response_sandbox_${TIMESTAMP}.json"
          echo "🗂️ Response archived at data/sandbox_responses/response_sandbox_${TIMESTAMP}.json"

      - name: Append summary to orchestration-ledger.md
        if: success()
        run: |
          TS=$(date -u +'%Y-%m-%d %H:%M UTC')
          FILE="data/sandbox_responses/response_sandbox_$(date +'%Y%m%d_%H%M').json"
          echo "| ${TS} | Sandbox archival verification | ${FILE} | CH Sandbox API |" >> orchestration-ledger.md
          echo "✅ Ledger updated"

      - name: Commit sandbox update
        if: success()
        env:
          GIT_AUTHOR_NAME: "Eckohaus Bot"
          GIT_AUTHOR_EMAIL: "info@eckohaus.co.uk"
          GIT_COMMITTER_NAME: "Eckohaus Bot"
          GIT_COMMITTER_EMAIL: "info@eckohaus.co.uk"
        run: |
          git add orchestration-ledger.md data/sandbox_responses/*.json || true
          git commit -m "Sandbox archival verification (Eckohaus Ltd 2013–2021)" \
            -m "Co-authored-by: system operator <wanda@openai.com>" \
            -m "Co-authored-by: system administrator <Corvin Nehal Dhali> <info@eckohaus.co.uk>" || echo "No changes to commit"
          git push || true
